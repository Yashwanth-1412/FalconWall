<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="880" rx="12" fill="#ffffff"/>

  <text x="600" y="14" text-anchor="middle" font-size="10.5" font-style="italic" fill="#475569">shared entry — both paths start here</text>
  <rect x="440" y="24" width="320" height="64" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="600" y="46" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">NIC + driver — NAPI poll</text>
  <text x="600" y="66" text-anchor="middle" font-size="11" fill="#64748b">hardirq → NET_RX_SOFTIRQ · DMA RX ring</text>

  <path d="M600,88 C600,108 290,108 290,140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600,88 C600,108 910,108 910,140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="290" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">SLOW PATH — Linux network stack</text>
  <text x="910" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#e11d48">FAST PATH — kernel bypass</text>

  <rect x="86" y="134" width="408" height="590" rx="10" fill="#f8fafc" opacity="0.55"/>
  <rect x="706" y="134" width="408" height="590" rx="10" fill="#f8fafc" opacity="0.55"/>

  <rect x="96" y="140" width="388" height="52" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">① sk_buff allocation + GRO</text>
  <text x="290" y="179" text-anchor="middle" font-size="11" fill="#64748b">slab alloc per packet · gro_list lock</text>

  <rect x="96" y="212" width="388" height="46" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">② tc ingress / Netfilter</text>
  <text x="290" y="248" text-anchor="middle" font-size="11" fill="#64748b">packet classifier · firewall hooks</text>

  <rect x="96" y="278" width="388" height="46" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="298" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">③ routing — ip_rcv() → ip_local_deliver()</text>
  <text x="290" y="314" text-anchor="middle" font-size="11" fill="#64748b">protocol walk · route lookup</text>

  <rect x="96" y="344" width="388" height="46" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="364" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">④ tcp_v4_rcv() / udp_rcv()</text>
  <text x="290" y="380" text-anchor="middle" font-size="11" fill="#64748b">socket lookup · protocol processing</text>

  <rect x="96" y="410" width="388" height="46" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">⑤ socket receive queue</text>
  <text x="290" y="446" text-anchor="middle" font-size="11" fill="#64748b">sk_receive_queue · lock contention</text>

  <rect x="96" y="476" width="388" height="46" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">⑥ epoll_wait() → task wakeup</text>
  <text x="290" y="512" text-anchor="middle" font-size="11" fill="#64748b">syscall · context switch into kernel</text>

  <rect x="96" y="542" width="388" height="46" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="562" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">⑦ recvmmsg() syscall</text>
  <text x="290" y="578" text-anchor="middle" font-size="11" fill="#64748b">syscall boundary · batched receive</text>

  <rect x="96" y="608" width="388" height="46" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="628" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">⑧ copy_to_user()</text>
  <text x="290" y="644" text-anchor="middle" font-size="11" fill="#64748b">memcpy: kernel buffer → user buffer</text>

  <rect x="96" y="674" width="388" height="46" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="290" y="694" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">⑨ return to userspace</text>
  <text x="290" y="710" text-anchor="middle" font-size="11" fill="#64748b">context switch back · packet in app buffer</text>

  <path d="M290,192 L290,212" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,258 L290,278" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,324 L290,344" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,390 L290,410" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,456 L290,476" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,522 L290,542" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,588 L290,608" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,654 L290,674" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M290,720 L290,800" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="762" font-size="10.5" font-style="italic" fill="#b91c1c">syscall + memcpy on every packet</text>

  <rect x="716" y="140" width="388" height="64" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="910" y="163" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">★ FalconWall — XDP hook (eBPF)</text>
  <text x="910" y="180" text-anchor="middle" font-size="11" fill="#64748b">bpf_prog_run_xdp() · native in-driver · before sk_buff exists</text>

  <rect x="716" y="240" width="180" height="44" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="806" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">XDP_DROP</text>
  <text x="806" y="274" text-anchor="middle" font-size="10.5" fill="#64748b">no sk_buff ever built</text>

  <path d="M790,204 L790,240" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <text x="724" y="236" font-size="11" font-weight="600" fill="#e11d48">XDP_DROP</text>
  <text x="1020" y="236" font-size="11" font-weight="600" fill="#e11d48">XDP_REDIRECT</text>

  <rect x="716" y="310" width="388" height="64" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="910" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">AF_XDP — kernel bypass</text>
  <text x="910" y="350" text-anchor="middle" font-size="11" fill="#64748b">umem + 4 rings · mmap-shared · lock-free · zero-copy</text>

  <path d="M1010,204 L1010,310" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <path d="M910,374 L910,800" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="1108" y="580" text-anchor="end" font-size="10.5" font-style="italic" fill="#15803d">no syscalls · no copies · direct ring reads</text>

  <path d="M716,172 L488,166" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-rose)"/>
  <text x="600" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e11d48">XDP_PASS — hand off to the</text>
  <text x="600" y="164" text-anchor="middle" font-size="11" font-weight="600" fill="#e11d48">Linux network stack</text>

  <rect x="6" y="268" width="84" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="48" y="285" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">slow-path costs</text>
  <rect x="6" y="300" width="84" height="26" rx="13" fill="#fee2e2"/>
  <text x="48" y="317" text-anchor="middle" font-size="10" fill="#b91c1c">syscall</text>
  <rect x="6" y="332" width="84" height="26" rx="13" fill="#fee2e2"/>
  <text x="48" y="349" text-anchor="middle" font-size="10" fill="#b91c1c">ctx switch</text>
  <rect x="6" y="364" width="84" height="26" rx="13" fill="#fee2e2"/>
  <text x="48" y="381" text-anchor="middle" font-size="10" fill="#b91c1c">copy_to_user</text>
  <rect x="6" y="396" width="84" height="26" rx="13" fill="#fee2e2"/>
  <text x="48" y="413" text-anchor="middle" font-size="10" fill="#b91c1c">slab alloc</text>
  <rect x="6" y="428" width="84" height="26" rx="13" fill="#fee2e2"/>
  <text x="48" y="445" text-anchor="middle" font-size="10" fill="#b91c1c">lock</text>

  <rect x="1116" y="268" width="84" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1158" y="285" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">fast-path wins</text>
  <rect x="1116" y="300" width="84" height="26" rx="13" fill="#dcfce7"/>
  <text x="1158" y="317" text-anchor="middle" font-size="10" fill="#15803d">0 syscalls</text>
  <rect x="1116" y="332" width="84" height="26" rx="13" fill="#dcfce7"/>
  <text x="1158" y="349" text-anchor="middle" font-size="10" fill="#15803d">0 ctx switch</text>
  <rect x="1116" y="364" width="84" height="26" rx="13" fill="#dcfce7"/>
  <text x="1158" y="381" text-anchor="middle" font-size="10" fill="#15803d">0 copies</text>
  <rect x="1116" y="396" width="84" height="26" rx="13" fill="#dcfce7"/>
  <text x="1158" y="413" text-anchor="middle" font-size="10" fill="#15803d">no sk_buff</text>
  <rect x="1116" y="428" width="84" height="26" rx="13" fill="#dcfce7"/>
  <text x="1158" y="445" text-anchor="middle" font-size="10" fill="#15803d">lock-free</text>

  <rect x="90" y="800" width="1100" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="600" y="822" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">USERSAPCE</text>
  <path d="M600,808 L600,850" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="842" text-anchor="middle" font-size="10.5" fill="#334155">slow: syscall + context switch + copy per packet</text>
  <text x="910" y="842" text-anchor="middle" font-size="10.5" fill="#334155">fast: zero syscalls · zero copies · direct ring reads</text>

  <text x="600" y="874" text-anchor="middle" font-size="10.5" font-style="italic" fill="#64748b">★ FalconWall runs at the XDP hook — verdicts land before the network stack allocates a single sk_buff</text>
</svg>